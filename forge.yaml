name: forge-register

artifactStorePath: .forge/artifact-store.yaml

build:
  - name: resolve-spec
    src: .
    engine: forge://generic-builder
    spec:
      command: sh
      args:
        - -c
        - >-
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-register-spec spec/register.v1.yaml .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-register-spec testdata/cases.json .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-revision-spec spec/revision.v1.yaml
          .forge/spec-cache/revision &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-revision-spec testdata/cases.json
          .forge/spec-cache/revision

  - name: generate-mocks
    src: .
    engine: forge://generic-builder
    spec:
      command: mockery

  - name: format-code
    src: .
    engine: forge://go-format

  - name: forge-register
    src: ./cmd/forge-register
    dest: ./build/bin
    engine: forge://go-build
    platforms: [linux/amd64, linux/arm64]

# The CLI as a first class run target. Every toolchain runnable declares
# forge-self-factory: the model has no exceptions.
run:
  - name: forge-register
    src: ./cmd/forge-register
    factory: git@github.com:alexandremahdhaoui/forge-self-factory.git

test:
  - name: lint
    runner: forge://go-lint

  # Every field a captured record carries is read, or explicitly ignored with
  # a reason. The parser read one field out of the record for a year and
  # every test passed, because the fixtures encoded the same blind spot.
  - name: unread-fields
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/unread-fields.sh"]

  - name: no-hardcoding
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/no-hardcoding.sh"]

  - name: standalone
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/standalone.sh"]

  - name: unwired
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/unwired.sh"]

  - name: architecture
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/architecture.sh"]

  - name: docs
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/docs-check.sh"]

  - name: unit
    runner: forge://go-test

  # The same tests as somebody who cannot write to /. Root hides a test that
  # names an absolute path and then creates it, which is how three defects
  # reached a colleague's machine green from here.
  - name: unit-nonroot
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/unit-nonroot.sh"]

  - name: conformance
    runner: forge://go-test
    spec:
      tags: [conformance]
      packages: [./test/conformance/...]

  - name: e2e
    runner: forge://go-test
    spec:
      tags: [e2e]
      packages: [./test/e2e/...]
      timeout: "15m"

  - name: coverage
    runner: forge://generic-test-runner
    spec:
      command: sh
      args: ["hack/coverage.sh", "90"]

  # The distribution build: every command cross-built CGO-off for the
  # release, named by the <name>_<os>_<arch> travel convention. The
  # pipeline's release stage globs build/dist into the aggregated release.
  - name: build-artifacts
    runner: forge://generic-test-runner
    spec:
      command: forge
      # Frozen: the distribution is the one build that must be reproducible,
      # so it proves the recorded lock and never repairs it.
      args: ["build", "--frozen", "--platforms", "linux/amd64,linux/arm64"]

factory:
  module: github.com/alexandremahdhaoui/forge-register
  goVersion: "1.26.5"
  manifest: committed
