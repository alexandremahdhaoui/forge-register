name: forge-register

artifactStorePath: .forge/artifact-store.yaml

build:
  - name: resolve-spec
    src: .
    engine: go://generic-builder
    spec:
      command: sh
      args:
        - -c
        - >-
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-register-spec spec/register.v1.yaml .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-register-spec testdata/cases.json .forge/spec-cache &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-revision-spec spec/revision.v1.yaml
          .forge/spec-cache/revision &&
          sh hack/resolve-spec.sh
          github.com/alexandremahdhaoui/forge-revision-spec testdata/cases.json
          .forge/spec-cache/revision

  # Every engine generates its MCP surface from forge-register-spec's schema,
  # the same file forge-factory reads, so the contract two tools share is the
  # one the engines are built from.
  - name: gen-register-discover
    src: ./cmd/register-discover
    engine: go://forge-dev

  - name: gen-register-evaluate
    src: ./cmd/register-evaluate
    engine: go://forge-dev

  - name: gen-register-publish
    src: ./cmd/register-publish
    engine: go://forge-dev

  - name: generate-mocks
    src: .
    engine: go://generic-builder
    spec:
      command: mockery

  - name: generate-docs
    src: .
    engine: go://generic-builder
    spec:
      command: go
      args: ["run", "./cmd/docgen"]

  - name: format-code
    src: .
    engine: go://go-format

  - name: forge-register
    src: ./cmd/forge-register
    dest: ./build/bin
    engine: go://go-build

  - name: register-discover
    src: ./cmd/register-discover
    dest: ./build/bin
    engine: go://go-build

  - name: register-evaluate
    src: ./cmd/register-evaluate
    dest: ./build/bin
    engine: go://go-build

  - name: register-publish
    src: ./cmd/register-publish
    dest: ./build/bin
    engine: go://go-build

test:
  - name: lint
    runner: go://go-lint

  - name: no-hardcoding
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/no-hardcoding.sh"]

  - name: standalone
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/standalone.sh"]

  - name: engine-docs
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/engine-docs.sh"]

  - name: unwired
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/unwired.sh"]

  - name: architecture
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/architecture.sh"]

  - name: docs
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/docs-check.sh"]

  - name: unit
    runner: go://go-test

  - name: integration
    runner: go://go-test
    spec:
      tags: [integration]
      packages: [./test/integration/...]

  - name: conformance
    runner: go://go-test
    spec:
      tags: [conformance]
      packages: [./test/conformance/...]

  - name: e2e
    runner: go://go-test
    spec:
      tags: [e2e]
      packages: [./test/e2e/...]
      timeout: "15m"

  - name: coverage
    runner: go://generic-test-runner
    spec:
      command: sh
      args: ["hack/coverage.sh", "95"]

factory:
  module: github.com/alexandremahdhaoui/forge-register
  goVersion: "1.26.5"
